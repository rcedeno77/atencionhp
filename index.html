        :root {
            --bg-body: #F8FAFC;
            --surface: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border-light: #E2E8F0;
            
            /* Colores de Acción */
            --primary: #2563EB;
            --primary-hover: #1D4ED8;
            --primary-glow: rgba(37, 99, 235, 0.15);
            --success: #10B981;
            
            /* Secciones Especiales */
            --msg-bg: #F1F5F9;
            --msg-border: #CBD5E1;
            --msg-icon: #475569;
            
            --premium-bg: linear-gradient(145deg, #FFFAF0 0%, #FFF4D4 100%);
            --premium-border: #FDE68A;
            --premium-text: #B45309;
            
            /* Sombras Premium */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);

            --shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            padding-bottom: 80px; 
            -webkit-font-smoothing: antialiased;
        }

        /* HEADER GLASSMORPHISM */
        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 24px 20px;
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        h1 { 
            font-size: 1.4rem; 
            font-weight: 700;
            color: var(--text-main); 
            text-align: center;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 i { color: var(--primary); }

        /* SEARCH BAR HIGH-END */
        .search-bar { width: 100%; max-width: 650px; position: relative; }
        .search-bar input {
            width: 100%; 
            padding: 16px 24px 16px 50px; 
            border-radius: 100px;
            border: 2px solid transparent; 
            background: #F1F5F9;
            font-size: 1.05rem; 
            font-weight: 500;
            color: var(--text-main);
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .search-bar input::placeholder { color: #94A3B8; font-weight: 400; }
        .search-bar input:hover { background: #E2E8F0; }
        .search-bar input:focus { 
            background: var(--surface);
            border-color: var(--primary); 
            box-shadow: 0 0 0 4px var(--primary-glow); 
        }
        .search-bar i { 
            position: absolute; left: 22px; top: 18px; 
            color: #94A3B8; font-size: 1.1rem;
            transition: color 0.3s ease;
        }
        .search-bar input:focus + i { color: var(--primary); } /* Cambio de color al enfocar */

        /* TITULOS DE SECCIÓN */
        .section-title {
            max-width: 1200px; margin: 40px auto 20px; padding: 0 20px;
            font-size: 1.1rem; font-weight: 700; color: var(--text-main);
            display: flex; align-items: center; gap: 10px;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .section-title i { opacity: 0.8; }

        /* GRID Y TARJETAS (CARDS) */
        .container {
            max-width: 1200px; margin: 0 auto 10px; padding: 0 20px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 24px;
        }

        .card {
            background: var(--surface); 
            border-radius: var(--radius-lg); 
            padding: 24px;
            border: 1px solid var(--border-light); 
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; gap: 12px;
            position: relative;
            overflow: hidden;
        }
        .card:hover { 
            transform: translateY(-4px); 
            box-shadow: var(--shadow-hover); 
            border-color: #CBD5E1;
        }
        
        .card h3 { 
            color: var(--text-main); 
            font-size: 1.15rem; 
            font-weight: 700;
            line-height: 1.3;
        }
        .card p { 
            color: var(--text-muted); 
            font-size: 0.95rem; 
            line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; 
        }

        /* CARD: Mensajes Rápidos */
        .card.msg-card {
            background: var(--msg-bg);
            border-color: var(--msg-border);
        }
        .card.msg-card h3 { color: var(--msg-icon); font-size: 1.05rem;}
        
        /* CARD: Premium */
        .card.premium-card {
            background: var(--premium-bg);
            border-color: var(--premium-border);
        }
        .card.premium-card:hover { border-color: #FBBF24; }
        .card.premium-card h3 { color: var(--premium-text); }
        
        /* Icono flotante al hacer hover */
        .card::after {
            content: '\f0c5'; /* Icono de copiar de FontAwesome */
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            bottom: 24px;
            right: 24px;
            color: var(--primary);
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s ease;
        }
        .card:hover::after {
            opacity: 1;
            transform: scale(1);
        }

        /* MODAL (UX Premium) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center;
            z-index: 1000; padding: 20px;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; }

        .modal {
            background: var(--surface); 
            width: 100%; max-width: 550px; 
            border-radius: 24px;
            padding: 32px; 
            position: relative; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform: translateY(20px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal { transform: translateY(0) scale(1); }

        .modal h2 { font-size: 1.3rem; color: var(--text-main); margin-bottom: 20px; }

        .close-btn { 
            position: absolute; top: 24px; right: 24px; 
            background: #F1F5F9; border: none; 
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; cursor: pointer; color: var(--text-muted); 
            transition: all 0.2s;
        }
        .close-btn:hover { background: #E2E8F0; color: #EF4444; }
        
        .preview-box {
            background: #F8FAFC; 
            border-radius: var(--radius-md); 
            padding: 24px; 
            margin-bottom: 24px;
            white-space: pre-wrap; 
            font-size: 0.95rem;

            max-height: 45vh; 
            overflow-y: auto;
            color: #334155;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.02);

        .preview-box::-webkit-scrollbar { width: 8px; }
        .preview-box::-webkit-scrollbar-track { background: transparent; }
        .preview-box::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        .preview-box::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

        function renderizarMensajesRapidos() {
            const grid = document.getElementById('mensajesGrid');
            grid.innerHTML = "";
            mensajesRapidos.forEach(msg => {
                const card = document.createElement('div');
                card.className = 'card msg-card';
                card.innerHTML = `
                    <h3><i class="fa-regular fa-comment-dots"></i> ${msg.titulo}</h3>
                    <p>${msg.texto}</p>
                `;
                card.onclick = () => abrirModalTextoDirecto(msg.texto);
                grid.appendChild(card);
            });
        }

        function generarTexto(propiedad) {
            if (propiedadesPremium.includes(propiedad.nombre)) {
                return `👋 ¡Hola! Gracias por tu interés en ${propiedad.nombre}\n\n🗓️ Si ya tienes fecha y a tu grupo listo para vivir una escapada inolvidable, debes ingresar al siguiente anuncio, hacer clic en el botón de WhatsApp y enviar allí las fechas exactas y cuántas personas son:\n\n🔗 ${propiedad.enlace}\n\n¡Clic al enlace o a la imagen!`;
            } else {
                return `👋 ¡Hola! Gracias por tu interés en ${propiedad.nombre}.\n\n🏡 En el siguiente anuncio encontrarás la información detallada de la propiedad y el enlace de contacto directo con el anfitrión para consultar disponibilidad y realizar tu reserva:\n\n🔗 ${propiedad.enlace}\n\n¡Clic al enlace o a la imagen!`;
            }
        }
        
        function renderizarPropiedades(filtro = "") {
            const premiumGrid = document.getElementById('premiumGrid');
            const standardGrid = document.getElementById('standardGrid');
            const seccionPremium = document.getElementById('seccionPremium');
            const seccionStandard = document.getElementById('seccionStandard');

            premiumGrid.innerHTML = "";
            standardGrid.innerHTML = "";

            const filtradas = propiedades.filter(p => p.nombre.toLowerCase().includes(filtro.toLowerCase()));
            
            let premiumCount = 0;
            let standardCount = 0;

            filtradas.forEach((prop) => {
                const card = document.createElement('div');
                
                if (propiedadesPremium.includes(prop.nombre)) {
                    card.className = 'card premium-card';
                    card.innerHTML = `
                        <h3>${prop.nombre}</h3>
                        <p>${prop.descripcion}</p>
                    `;
                    card.onclick = () => abrirModalTextoDirecto(generarTexto(prop));
                    premiumGrid.appendChild(card);
                    premiumCount++;
                } else {
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${prop.nombre}</h3>
                        <p>${prop.descripcion}</p>
                    `;
                    card.onclick = () => abrirModalTextoDirecto(generarTexto(prop));
                    standardGrid.appendChild(card);
                    standardCount++;
                }
            });

            seccionPremium.style.display = premiumCount > 0 ? "block" : "none";
            seccionStandard.style.display = standardCount > 0 ? "block" : "none";
        }

        function filtrarPropiedades() {
            const input = document.getElementById('searchInput').value;
            const seccionMensajes = document.getElementById('seccionMensajes');

            if (input.trim() === "") {
                seccionMensajes.style.display = "block";
            } else {
                seccionMensajes.style.display = "none";
            }
            renderizarPropiedades(input);
        }

        const modalOverlay = document.getElementById('modal');
        const preview = document.getElementById('mensajePreview');
        const btnCopiar = document.getElementById('btnCopiar');
        let textoActual = "";

        function abrirModalTextoDirecto(texto) {
            textoActual = texto;
            preview.textContent = textoActual;
            btnCopiar.innerHTML = '<i class="fa-regular fa-copy"></i> Copiar Mensaje';
            btnCopiar.classList.remove('success');
            
            modalOverlay.style.display = 'flex';
            // Pequeño timeout para que la transición CSS surta efecto
            setTimeout(() => { modalOverlay.classList.add('active'); }, 10);
        }

        function cerrarModal() {
            modalOverlay.classList.remove('active');
            setTimeout(() => { modalOverlay.style.display = 'none'; }, 300); // Esperar que termine la animación
        }

        function copiarAlPortapapeles() {
            navigator.clipboard.writeText(textoActual).then(() => {
                btnCopiar.innerHTML = '<i class="fa-solid fa-check"></i> ¡Copiado con éxito!';
                btnCopiar.classList.add('success');
                setTimeout(cerrarModal, 1200); 
            }).catch(err => {
                console.error('Error al copiar: ', err);
                alert("Hubo un error al intentar copiar. Por favor, selecciona el texto manualmente.");
            });
        }

        // Cierra el modal si haces clic fuera de la tarjeta blanca
        modalOverlay.addEventListener('click', function(event) {
            if (event.target === modalOverlay) {
                cerrarModal();
            }
        });

        // Inicializar
        renderizarMensajesRapidos();
        renderizarPropiedades();
