    <style>
        :root {
            /* Paleta High-End Minimalista */
            --bg-body: #F3F4F6; 
            --surface: #FFFFFF;
            --text-main: #111827; 
            --text-muted: #4B5563; 
            --border-light: #E5E7EB;
            
            /* Acentos Corporativos */
            --primary: #0F172A; 
            --primary-accent: #2563EB; 
            --success: #059669;
            
            /* Sombras Premium */
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --shadow-hover: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            padding-bottom: 80px; 
            -webkit-font-smoothing: antialiased;
        }

        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 24px 20px;
            border-bottom: 1px solid var(--border-light);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
        }

        h1 { 
            font-size: 1.5rem; 
            font-weight: 700;
            color: var(--primary); 
            text-align: center;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 i { color: var(--primary-accent); }

        .search-bar { width: 100%; max-width: 650px; position: relative; }
        .search-bar input {
            width: 100%; 
            padding: 16px 24px 16px 52px; 
            border-radius: 12px;
            border: 1px solid #D1D5DB; 
            background: #F9FAFB;
            font-size: 1.05rem; 
            font-weight: 500;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.03);
        }
        .search-bar input::placeholder { color: #9CA3AF; font-weight: 400; }
        .search-bar input:hover { background: var(--surface); border-color: #9CA3AF; }
        .search-bar input:focus { 
            background: var(--surface);
            border-color: var(--primary-accent); 
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); 
        }
        .search-bar i { 
            position: absolute; left: 20px; top: 18px; 
            color: #9CA3AF; font-size: 1.1rem;
            transition: color 0.2s ease;
        }
        .search-bar input:focus + i { color: var(--primary-accent); }

        .section-title {
            max-width: 1200px; margin: 40px auto 20px; padding: 0 20px;
            font-size: 1.05rem; font-weight: 700; color: var(--text-muted);
            display: flex; align-items: center; gap: 10px;
            text-transform: uppercase; letter-spacing: 0.05em;
        }

        .container {
            max-width: 1200px; margin: 0 auto 20px; padding: 0 20px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px;
        }

        .card {
            background: var(--surface); 
            border-radius: 12px; 
            padding: 24px;
            border: 1px solid var(--border-light); 
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
            display: flex; flex-direction: column; gap: 8px;
            position: relative;
        }
        .card:hover { 
            transform: translateY(-3px); 
            box-shadow: var(--shadow-hover); 
            border-color: #D1D5DB;
        }
        .card h3 { 
            color: var(--text-main); 
            font-size: 1.15rem; 
            font-weight: 700;
            line-height: 1.3;
        }
        .card p { 
            color: var(--text-muted); 
            font-size: 0.95rem; 
            line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; 
        }

        .card.msg-card {
            background: #F8FAFC;
            border: none;
            border-left: 4px solid #94A3B8;
            box-shadow: none;
        }
        .card.msg-card:hover { background: #F1F5F9; border-left-color: var(--primary-accent); }
        .card.msg-card h3 { color: #334155; font-size: 1.05rem;}

        .card.premium-card {
            background: var(--surface);
            border: 1px solid #BFDBFE; 
            border-top: 4px solid var(--primary-accent); 
            box-shadow: 0 4px 15px -3px rgba(37, 99, 235, 0.08); 
        }
        .card.premium-card:hover { 
            border-color: #93C5FD; 
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.15); 
        }
        .card.premium-card h3 { color: var(--primary); }

        .card::after {
            content: '\f0c5'; 
            font-family: 'Font Awesome 6 Free'; font-weight: 900;
            position: absolute; bottom: 24px; right: 24px;
            color: var(--primary-accent);
            opacity: 0; transform: scale(0.8); transition: all 0.2s ease;
        }
        .card:hover::after { opacity: 1; transform: scale(1); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(17, 24, 39, 0.7); 
            backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center;
            z-index: 1000; padding: 20px;
            opacity: 0; transition: opacity 0.2s ease;
        }
        .modal-overlay.active { opacity: 1; }

        .modal {
            background: var(--surface); 
            width: 100%; max-width: 550px; 
            border-radius: 16px;
            padding: 32px; 
            position: relative; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform: translateY(20px) scale(0.95);
            transition: all 0.2s ease;
        }
        .modal-overlay.active .modal { transform: translateY(0) scale(1); }

        .modal h2 { font-size: 1.3rem; color: var(--primary); margin-bottom: 20px; font-weight: 700; }

        .close-btn { 
            position: absolute; top: 20px; right: 20px; 
            background: transparent; border: none; 
            width: 32px; height: 32px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; cursor: pointer; color: #9CA3AF; 
            transition: all 0.2s;
        }
        .close-btn:hover { background: #F3F4F6; color: #111827; }
        
        .preview-box {
            background: #F9FAFB; 
            border-radius: 8px; 
            padding: 20px; 
            margin-bottom: 24px;
            white-space: pre-wrap; 
            font-size: 0.95rem; 
            line-height: 1.6; 
            border: 1px solid var(--border-light);
            max-height: 45vh; 
            overflow-y: auto;
            color: #374151;
        }
        
        .preview-box::-webkit-scrollbar { width: 6px; }
        .preview-box::-webkit-scrollbar-track { background: transparent; }
        .preview-box::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 10px; }

        .btn-copy {

            background: var(--primary-accent);

            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
            transition: all 0.2s;

        .btn-copy:active { transform: translateY(1px); }
        .btn-copy.success { background: var(--success); box-shadow: 0 4px 6px -1px rgba(5, 150, 105, 0.2); }

        function renderizarMensajesRapidos() {
            const grid = document.getElementById('mensajesGrid');
            grid.innerHTML = "";
            mensajesRapidos.forEach(msg => {
                const card = document.createElement('div');
                card.className = 'card msg-card';
                card.innerHTML = `
                    <h3><i class="fa-regular fa-comment-dots"></i> ${msg.titulo}</h3>
                    <p>${msg.texto}</p>
                `;
                card.onclick = () => abrirModalTextoDirecto(msg.texto);
                grid.appendChild(card);
            });
        }

        function generarTexto(propiedad) {
            if (propiedadesDestacadas.includes(propiedad.nombre)) {
                return `👋 ¡Hola! Gracias por tu interés en ${propiedad.nombre}\n\n🗓️ Si ya tienes fecha y a tu grupo listo para vivir una escapada inolvidable, debes ingresar al siguiente anuncio, hacer clic en el botón de WhatsApp y enviar allí las fechas exactas y cuántas personas son:\n\n🔗 ${propiedad.enlace}\n\n¡Clic al enlace o a la imagen!`;
            } else {
                return `👋 ¡Hola! Gracias por tu interés en ${propiedad.nombre}.\n\n🏡 En el siguiente anuncio encontrarás la información detallada de la propiedad y el enlace de contacto directo con el anfitrión para consultar disponibilidad y realizar tu reserva:\n\n🔗 ${propiedad.enlace}\n\n¡Clic al enlace o a la imagen!`;
            }
        }
        
        function renderizarPropiedades(filtro = "") {
            const premiumGrid = document.getElementById('premiumGrid');
            const standardGrid = document.getElementById('standardGrid');
            const seccionPremium = document.getElementById('seccionPremium');
            const seccionStandard = document.getElementById('seccionStandard');

            premiumGrid.innerHTML = "";
            standardGrid.innerHTML = "";

            const filtradas = propiedades.filter(p => p.nombre.toLowerCase().includes(filtro.toLowerCase()));
            
            let premiumCount = 0;
            let standardCount = 0;

            filtradas.forEach((prop) => {
                const card = document.createElement('div');
                
                if (propiedadesDestacadas.includes(prop.nombre)) {
                    card.className = 'card premium-card';
                    card.innerHTML = `
                        <h3>${prop.nombre}</h3>
                        <p>${prop.descripcion}</p>
                    `;
                    card.onclick = () => abrirModalTextoDirecto(generarTexto(prop));
                    premiumGrid.appendChild(card);
                    premiumCount++;
                } else {
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${prop.nombre}</h3>
                        <p>${prop.descripcion}</p>
                    `;
                    card.onclick = () => abrirModalTextoDirecto(generarTexto(prop));
                    standardGrid.appendChild(card);
                    standardCount++;
                }
            });

            seccionPremium.style.display = premiumCount > 0 ? "block" : "none";
            seccionStandard.style.display = standardCount > 0 ? "block" : "none";
        }

        function filtrarPropiedades() {
            const input = document.getElementById('searchInput').value;
            const seccionMensajes = document.getElementById('seccionMensajes');

            if (input.trim() === "") {
                seccionMensajes.style.display = "block";
            } else {
                seccionMensajes.style.display = "none";
            }
            renderizarPropiedades(input);
        }

        const modalOverlay = document.getElementById('modal');
        const preview = document.getElementById('mensajePreview');
        const btnCopiar = document.getElementById('btnCopiar');
        let textoActual = "";

        function abrirModalTextoDirecto(texto) {
            textoActual = texto;
            preview.textContent = textoActual;
            btnCopiar.innerHTML = '<i class="fa-regular fa-copy"></i> Copiar Mensaje';
            btnCopiar.classList.remove('success');
            
            modalOverlay.style.display = 'flex';
            setTimeout(() => { modalOverlay.classList.add('active'); }, 10);
        }

        function cerrarModal() {
            modalOverlay.classList.remove('active');
            setTimeout(() => { modalOverlay.style.display = 'none'; }, 200); 
        }

        function copiarAlPortapapeles() {
            navigator.clipboard.writeText(textoActual).then(() => {
                btnCopiar.innerHTML = '<i class="fa-solid fa-check"></i> ¡Copiado con éxito!';
                btnCopiar.classList.add('success');
                setTimeout(cerrarModal, 1200); 
            }).catch(err => {
                console.error('Error al copiar: ', err);
                alert("Hubo un error al intentar copiar. Por favor, selecciona el texto manualmente.");
            });
        }

        modalOverlay.addEventListener('click', function(event) {
            if (event.target === modalOverlay) {
                cerrarModal();
            }
        });

        renderizarMensajesRapidos();
        renderizarPropiedades();
